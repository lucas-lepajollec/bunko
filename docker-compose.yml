# Bunko alone, next to the Suwayomi and Kavita you already run.
#   docker compose up -d
#   docker compose exec bunko cat /data/access.token   -> sign in at http://<host>:2512
# Addresses, keys and target libraries are set in the interface (Settings).
services:
  bunko:
    image: ghcr.io/lucas-lepajollec/bunko:latest
    container_name: bunko
    restart: unless-stopped
    ports:
      - "${BUNKO_PORT:-2512}:2512"
    volumes:
      # Database, access token and settings key. Back it up.
      - bunko-data:/data
      # The folder that contains your Kavita libraries (writable by UID 1000).
      - ${KAVITA_LIBRARIES:-./library}:/library
    # Optional: pre-fill the Suwayomi address (Settings can change it).
    # environment:
    #   SUWAYOMI_URL: http://192.168.1.10:4567
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Uncomment to reach services published on this Docker host as "host.docker.internal".
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

volumes:
  bunko-data:
