# KaviSeerr alone, connected to the Suwayomi and Kavita you already run.
# 1. Copy .env.example to .env and adjust it (or edit the values below).
# 2. docker compose up -d
# 3. docker compose exec kaviseerr cat /data/access.token   -> sign in at http://<host>:2512
services:
  kaviseerr:
    image: ghcr.io/lucas-lepajollec/kaviseer:latest
    container_name: kaviseerr
    restart: unless-stopped
    ports:
      - "${KAVISEERR_PORT:-2512}:2512"
    environment:
      # Your existing Suwayomi, as reachable FROM this container (not "localhost").
      # It can also be changed later in Settings -> Connections.
      SUWAYOMI_URL: ${SUWAYOMI_URL:-http://192.168.1.10:4567}
    volumes:
      # Database, access token and settings key. Back it up.
      - kaviseerr-data:/data
      # Where imported chapters (CBZ) are written. Mount the same folder in Kavita
      # and add it to a manga library. Must be writable by UID 1000.
      - ${KAVISEERR_LIBRARY:-./library}:/library
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Uncomment to reach services published on this Docker host as "host.docker.internal".
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

volumes:
  kaviseerr-data:
