name: Native image candidate

on:
  workflow_call:
    inputs:
      architecture:
        description: Native Linux architecture (amd64 or arm64)
        required: true
        type: string
    outputs:
      digest:
        description: Immutable image index that passed the native smoke tests
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lucas-lepajollec/bunko

jobs:
  build:
    name: Build and smoke-test
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.verified.outputs.digest }}
    steps:
      - name: Validate architecture
        env:
          TARGET_ARCH: ${{ inputs.architecture }}
        run: |
          case "$TARGET_ARCH" in amd64|arm64) ;; *) exit 1 ;; esac
          test "$(docker version --format '{{.Server.Arch}}')" = "$TARGET_ARCH"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=long

      - name: Build the candidate once and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ inputs.architecture }}
          pull: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=bunko-${{ inputs.architecture }},timeout=2m
          cache-to: type=gha,scope=bunko-${{ inputs.architecture }},mode=max,timeout=2m,ignore-error=true
          provenance: mode=max
          sbom: true

      # Pull and test the exact registry object, including the native SQLite
      # module. Rebuilding or testing a different local image would break the gate.
      - name: Smoke-test the immutable candidate
        id: verified
        env:
          TARGET_ARCH: ${{ inputs.architecture }}
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image_ref="$IMAGE@$CANDIDATE_DIGEST"
          docker pull --platform "linux/$TARGET_ARCH" "$image_ref"
          actual="$(docker image inspect "$image_ref" --format '{{.Architecture}} {{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "$actual" = "$TARGET_ARCH $GITHUB_SHA"
          scripts/container-smoke.sh "$image_ref"
          echo "digest=$CANDIDATE_DIGEST" >> "$GITHUB_OUTPUT"
